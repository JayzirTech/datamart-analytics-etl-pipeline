services:
  # ============================================================================
  # 1. Base de Datos de Metadatos de Airflow (PostgreSQL 1 - Interno)
  # ============================================================================
  postgres_airflow:
    image: postgres:15-alpine
    container_name: datamart_postgres_airflow
    environment:
      POSTGRES_USER: ${POSTGRES_AIRFLOW_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD:-airflow_secret_password}
      POSTGRES_DB: ${POSTGRES_AIRFLOW_DB:-airflow_metadata}
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AIRFLOW_USER:-airflow} -d ${POSTGRES_AIRFLOW_DB:-airflow_metadata}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - datamart_network

  # ============================================================================
  # 2. Repositorio Analítico / Data Warehouse (PostgreSQL 2 - DWH)
  # ============================================================================
  postgres_dwh:
    image: postgres:15-alpine
    container_name: datamart_postgres_dwh
    environment:
      POSTGRES_USER: ${DWH_DB_USER:-dwh_user}
      POSTGRES_PASSWORD: ${DWH_DB_PASSWORD:-dwh_secret_password}
      POSTGRES_DB: ${DWH_DB_NAME:-datamart_dwh}
    ports:
      - "${DWH_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_dwh_data:/var/lib/postgresql/data
      - ./dwh_init/01_init_dwh.sql:/docker-entrypoint-initdb.d/01_init_dwh.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DWH_DB_USER:-dwh_user} -d ${DWH_DB_NAME:-datamart_dwh}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - datamart_network

  # ============================================================================
  # 3. Message Broker para CeleryExecutor (RabbitMQ con Management UI)
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: datamart_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-airflow_broker}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-broker_secret_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - datamart_network

  # ============================================================================
  # 4. Microservicio Catálogo de Productos (FastAPI)
  # ============================================================================
  fastapi_products:
    build:
      context: ./fastapi_products
      dockerfile: Dockerfile
    container_name: datamart_fastapi_products
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    restart: unless-stopped
    networks:
      - datamart_network

  # ============================================================================
  # 5. Inicializador de Airflow (Migraciones, Admin, Conexiones, Variables y Datos)
  # ============================================================================
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: datamart-airflow:3.3.2
    container_name: datamart_airflow_init
    entrypoint: /bin/bash
    command: /opt/airflow/scripts/init_airflow.sh
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_AIRFLOW_USER:-airflow}:${POSTGRES_AIRFLOW_PASSWORD:-airflow_secret_password}@postgres_airflow:5432/${POSTGRES_AIRFLOW_DB:-airflow_metadata}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_AIRFLOW_USER:-airflow}:${POSTGRES_AIRFLOW_PASSWORD:-airflow_secret_password}@postgres_airflow:5432/${POSTGRES_AIRFLOW_DB:-airflow_metadata}
      AIRFLOW__CELERY__BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-airflow_broker}:${RABBITMQ_DEFAULT_PASS:-broker_secret_password}@rabbitmq:5672//
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW_CONN_POSTGRES_DWH_CONN: postgresql://${DWH_DB_USER:-dwh_user}:${DWH_DB_PASSWORD:-dwh_secret_password}@postgres_dwh:5432/${DWH_DB_NAME:-datamart_dwh}
      AIRFLOW_VAR_RAW_DATA_PATH: ${RAW_DATA_PATH:-/opt/airflow/data/raw}
      AIRFLOW_VAR_FASTAPI_BASE_URL: ${FASTAPI_BASE_URL:-http://fastapi_products:8000}
      AIRFLOW_VAR_PIPELINE_ENVIRONMENT: ${PIPELINE_ENVIRONMENT:-development}
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
      _AIRFLOW_WWW_USER_ROLE: ${_AIRFLOW_WWW_USER_ROLE:-Admin}
      _AIRFLOW_WWW_USER_EMAIL: ${_AIRFLOW_WWW_USER_EMAIL:-admin@datamart.com}
      DWH_DB_USER: ${DWH_DB_USER:-dwh_user}
      DWH_DB_PASSWORD: ${DWH_DB_PASSWORD:-dwh_secret_password}
      DWH_DB_NAME: ${DWH_DB_NAME:-datamart_dwh}
      PYTHONPATH: /opt/airflow:/opt/airflow/src
    volumes: &airflow-common-volumes
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    depends_on:
      postgres_airflow:
        condition: service_healthy
      postgres_dwh:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      fastapi_products:
        condition: service_started
    networks:
      - datamart_network

  # ============================================================================
  # 6. Webserver de Airflow (UI http://localhost:8080)
  # ============================================================================
  airflow-webserver:
    image: datamart-airflow:3.3.2
    container_name: datamart_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    environment:
      <<: *airflow-common-env
    volumes:
      <<: *airflow-common-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - datamart_network

  # ============================================================================
  # 7. Scheduler de Airflow
  # ============================================================================
  airflow-scheduler:
    image: datamart-airflow:3.3.2
    container_name: datamart_airflow_scheduler
    command: scheduler
    environment:
      <<: *airflow-common-env
    volumes:
      <<: *airflow-common-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - datamart_network

  # ============================================================================
  # 8. Worker de Celery de Airflow
  # ============================================================================
  airflow-worker:
    image: datamart-airflow:3.3.2
    container_name: datamart_airflow_worker
    command: celery worker
    environment:
      <<: *airflow-common-env
    volumes:
      <<: *airflow-common-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - datamart_network

networks:
  datamart_network:
    driver: bridge

volumes:
  postgres_airflow_data:
  postgres_dwh_data:
  rabbitmq_data:
